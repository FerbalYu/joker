name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # CI validates deterministic local code paths only; no real Provider/MCP credentials or calls.
      CI: true
      JOKER_DISABLE_EXTERNAL_SERVICES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Script syntax
        run: node --check scripts/lint.mjs && node --check scripts/run-tests.mjs
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: coverage/
          if-no-files-found: warn
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: out/
          if-no-files-found: error
