name: Release qualification

on:
  workflow_dispatch:
    inputs:
      enable_signed_release:
        description: 'Run the fail-closed signed release contract'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  windows-native:
    name: Windows native package qualification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
      JOKER_DISABLE_EXTERNAL_SERVICES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows NSIS package
        run: npm run build:dist
      - name: Release boundary audit
        run: npm run test:qualification:release-boundaries
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-qualification
          path: |
            dist/*.exe
          if-no-files-found: error

  signed-release-contract:
    name: Signed release contract (fail closed)
    if: github.event_name == 'workflow_dispatch' && inputs.enable_signed_release == true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify signing credentials are present
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" || { echo 'CSC_LINK and CSC_KEY_PASSWORD are required.' >&2; exit 1; }
      - name: Run sign and verify qualification
        env:
          JOKER_SIGNED_REPORT_DIR: ${{ runner.temp }}/joker-signed-release
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run test:qualification:signed-release
      - name: Upload signed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-qualification
          path: |
            dist/*.exe
            ${{ runner.temp }}/joker-signed-release/signed-release-report.json
          if-no-files-found: error
